# Public figures Orbite follows on live data.
#
# Rules (docs/ETHICS.md):
#  - Official accounts of public figures only. Never add private individuals.
#  - Fill youtube_channel_id / bluesky_handle ONLY after a human confirms them
#    (run `python scripts/resolve_accounts.py` for Wikidata suggestions).
#  - Same list and same method for every political side.
#
# wikipedia_fr feeds the free public-attention index (no key needed).
# Starting list: candidates LCP listed as "expected on the starting line" or
# centre/right possible, read 25 Nov 2026. Order follows that source, not polls.

